[project]
name = "03-clear-architecture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cookiecutter>=2.7.1",
    "dishka>=1.9.1",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rust-just>=1.47.0",
    "sqlalchemy[async]>=2.0.48",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = ["mypy>=1.19.1", "ruff>=0.15.6"]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-clarity>=1.0.1",
    "pytest-cov>=7.1.0",
    "pytest-pythonpath>=0.7.3",
    "pytest-rich>=0.2.0",
    "pytest-sugar>=1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src",]
